name: Numina Site 4.0 trusted build and provenance

# Numina owner-governed builder. Source and signer identities are pinned by the release verifier.
# No caller-supplied commands, source refs, artifact paths, runner labels or secrets.
on:
  workflow_call:
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_sha256:
        value: ${{ jobs.attest.outputs.artifact_sha256 }}
      inventory_artifact_id:
        value: ${{ jobs.build.outputs.inventory_artifact_id }}
      attestation_url:
        value: ${{ jobs.attest.outputs.attestation_url }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      inventory_artifact_id: ${{ steps.upload_inventory.outputs.artifact-id }}
    steps:
      - name: Require the designated protected source branch
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_PROTECTED: ${{ github.ref_protected }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_HOST: ${{ github.server_url }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_HOST" == 'https://github.com' ]]
          [[ "$SOURCE_REPOSITORY" == 'skott34-dot/numina-production' ]]
          [[ "$SOURCE_REPOSITORY_ID" == '1367647143' ]]
          [[ "$SOURCE_REF" == 'refs/heads/main' ]]
          [[ "$SOURCE_PROTECTED" == 'true' ]]
          [[ "$SOURCE_EVENT" == 'workflow_dispatch' ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout the triggering immutable source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select the reviewed Node release without dependency caches
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Build and package the actual Site source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          # Current Site has no npm dependencies. Dependency additions require a
          # reviewed workflow/lockfile change; no implicit install or lifecycle hooks.
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(p.version!=="4.0.0" || ["dependencies","devDependencies","optionalDependencies"].some(k=>Object.keys(p[k]||{}).length)) throw Error("Build policy needs review"); fs.rmSync("dist",{recursive:true,force:true});'
          node scripts/build.mjs
          node scripts/package.mjs "$RUNNER_TEMP/numina-site-v4.0.0.tar.gz"
          # No tests are run by this workflow. A copied conformance fixture is
          # historical input, never evidence that this hosted build ran tests.
      - name: Store the exact deployment archive as one immutable artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/numina-site-v4.0.0.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Store the exact application inventory as a second subject
        id: upload_inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/client/downloads/application-release-v4.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Owner-governed environment restricted to protected main; no application
    # or deployment secrets. No independent human review is claimed.
    environment: numina-provenance
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_sha256: ${{ steps.digest.outputs.sha256 }}
      attestation_url: ${{ steps.sign.outputs.attestation-url }}
    steps:
      # Fresh job: no checkout, source scripts, archive extraction, npm or caches.
      - name: Receive this build's immutable raw archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/incoming
          skip-decompress: true
          digest-mismatch: error
      - name: Receive the immutable inventory from this same build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.inventory_artifact_id }}
          path: ${{ runner.temp }}/inventory
          skip-decompress: true
          digest-mismatch: error
      - name: Calculate the full deployment artifact digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/incoming/numina-site-v4.0.0.tar.gz"
          [[ -f "$artifact" && ! -L "$artifact" ]]
          digest="$(sha256sum -- "$artifact" | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Create platform-identity build provenance for those bytes
        id: sign
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ runner.temp }}/incoming/numina-site-v4.0.0.tar.gz
            ${{ runner.temp }}/inventory/application-release-v4.json
          # Use the action's generated SLSA predicate. Do not accept a predicate
          # supplied by source code or turn a runtime receipt into provenance.
      - name: Retain the actual Sigstore bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numina-site-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.sign.outputs.bundle-path }}
          if-no-files-found: error
          overwrite: false
          retention-days: 30
