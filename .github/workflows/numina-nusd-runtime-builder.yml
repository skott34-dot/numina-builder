name: Numina NUSD Linux runtime build and provenance

# Separate runtime subjects; never runs or replaces the website release workflow.
# No caller inputs, caller-supplied commands, application credentials or deployment.
on:
  workflow_call:
    outputs:
      source_artifact_id:
        value: ${{ jobs.build.outputs.source_artifact_id }}
      image_artifact_id:
        value: ${{ jobs.build.outputs.image_artifact_id }}
      inventory_artifact_id:
        value: ${{ jobs.build.outputs.inventory_artifact_id }}
      source_sha256:
        value: ${{ jobs.attest.outputs.source_sha256 }}
      image_archive_sha256:
        value: ${{ jobs.attest.outputs.image_archive_sha256 }}
      inventory_sha256:
        value: ${{ jobs.attest.outputs.inventory_sha256 }}
      attestation_url:
        value: ${{ jobs.attest.outputs.attestation_url }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      source_artifact_id: ${{ steps.upload_source.outputs.artifact-id }}
      image_artifact_id: ${{ steps.upload_image.outputs.artifact-id }}
      inventory_artifact_id: ${{ steps.upload_inventory.outputs.artifact-id }}
    env:
      EXPECTED_BASE_IMAGE: node:24.21.0-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
    steps:
      - name: Require the designated protected source branch
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_PROTECTED: ${{ github.ref_protected }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_HOST: ${{ github.server_url }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_HOST" == 'https://github.com' ]]
          [[ "$SOURCE_REPOSITORY" == 'skott34-dot/numina-production' ]]
          [[ "$SOURCE_REPOSITORY_ID" == '1367647143' ]]
          [[ "$SOURCE_REF" == 'refs/heads/main' ]]
          [[ "$SOURCE_PROTECTED" == 'true' ]]
          [[ "$SOURCE_EVENT" == 'workflow_dispatch' ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout the triggering immutable source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Stage the fixed public runtime source allowlist
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          python3 - <<'PY'
          import gzip, hashlib, io, json, os, pathlib, shutil, stat, tarfile
          source = pathlib.Path('runtime/nusd')
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / 'numina-runtime-build' / 'numina-nusd-linux-runtime'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'numina-runtime-artifacts'
          expected = [
              '.dockerignore', '.env.example', 'base-image.json', 'compose.yaml', 'Dockerfile', 'README.md',
              'package.json', 'package-lock.json', 'runtime-entrypoint.mjs',
              'scripts/managed-deployment.mjs', 'scripts/validate-deployment.mjs', 'scripts/verify-network.mjs',
              'contracts/NuminaUSD.sol', 'artifacts/NuminaUSD.json',
              'licenses/OpenZeppelin-LICENSE', 'licenses/ethers-LICENSE.md',
          ]
          if not source.is_dir() or any(p.is_symlink() for p in (source, *source.parents)):
              raise SystemExit('Runtime source root must be a real directory')
          actual = []
          for item in source.rglob('*'):
              mode = item.lstat().st_mode
              if stat.S_ISLNK(mode) or not (stat.S_ISDIR(mode) or stat.S_ISREG(mode)):
                  raise SystemExit('Runtime source contains a link or special file')
              if stat.S_ISREG(mode):
                  actual.append(item.relative_to(source).as_posix())
          if sorted(actual) != sorted(expected):
              raise SystemExit('Runtime source must match the exact public file allowlist')
          if stage.exists() or output.exists():
              raise SystemExit('Refusing to reuse a staging or output directory')
          stage.mkdir(parents=True)
          output.mkdir()
          records = []
          for relative in sorted(expected):
              original = source / relative
              if original.stat().st_size > 2 * 1024 * 1024:
                  raise SystemExit('Runtime source file exceeds size policy')
              data = original.read_bytes()
              destination = stage / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              records.append({'path': relative, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          package = json.loads((stage / 'package.json').read_text())
          if package.get('dependencies') != {'ethers': '6.15.0'} or any(package.get(k) for k in ('devDependencies', 'optionalDependencies')):
              raise SystemExit('Runtime dependency policy requires review')
          # Only this reviewed build recipe may execute commands. Changes require
          # a new builder review, so inventory flags cannot silently outlive it.
          if hashlib.sha256((stage / 'Dockerfile').read_bytes()).hexdigest() != '0f79e7826ee81991687987b91912809b43f6221e8303579a3b4c9c89e64b6527':
              raise SystemExit('Runtime Dockerfile differs from the reviewed build recipe')
          base = json.loads((stage / 'base-image.json').read_text())
          pin = os.environ['EXPECTED_BASE_IMAGE']
          if base.get('image') != pin or (stage / '.env.example').read_text().strip() != 'NODE_IMAGE=' + pin:
              raise SystemExit('Base image configuration does not match the reviewed pin')
          artifact = json.loads((stage / 'artifacts/NuminaUSD.json').read_text())
          source_digest = hashlib.sha256((stage / 'contracts/NuminaUSD.sol').read_bytes()).hexdigest()
          if artifact.get('schema') != 'numina.nusd.contract-candidate.v2' or artifact.get('sourceSha256') != source_digest:
              raise SystemExit('Precompiled contract artifact and source identity do not match')
          if artifact.get('contractName') != 'NuminaUSD' or artifact.get('compilerSettings', {}).get('evmVersion') != 'london':
              raise SystemExit('Precompiled contract identity requires review')
          # Source scripts are data here. No source packager, compiler or tests run.
          archive_path = output / 'numina-nusd-linux-runtime-source.tar.gz'
          with archive_path.open('xb') as raw, gzip.GzipFile(filename='', fileobj=raw, mode='wb', mtime=0) as compressed:
              with tarfile.open(fileobj=compressed, mode='w', format=tarfile.PAX_FORMAT) as archive:
                  for record in records:
                      data = (stage / record['path']).read_bytes()
                      info = tarfile.TarInfo('numina-nusd-linux-runtime/' + record['path'])
                      info.size, info.mode, info.mtime, info.uid, info.gid = len(data), 0o644, 0, 0, 0
                      info.uname = info.gname = ''
                      archive.addfile(info, io.BytesIO(data))
          (output / 'source-files.json').write_text(json.dumps(records, sort_keys=True, indent=2) + '\n')
          PY
      - name: Build the actual Linux image without starting the application
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/numina-runtime-build/numina-nusd-linux-runtime"
          output="$RUNNER_TEMP/numina-runtime-artifacts"
          # Docker build executes the reviewed Dockerfile's npm ci build steps.
          # It does not invoke the runtime entrypoint, Compose, tests or any RPC.
          docker version --format '{{json .}}' > "$output/docker-version.json"
          docker build --pull --no-cache --platform linux/amd64 \
            --build-arg "NODE_IMAGE=$EXPECTED_BASE_IMAGE" \
            --iidfile "$output/image-id.txt" \
            --tag numina-nusd-runtime:candidate "$context"
          docker image inspect numina-nusd-runtime:candidate > "$output/image-inspect.json"
          docker image save numina-nusd-runtime:candidate | gzip -n > "$output/numina-nusd-linux-runtime-image.docker.tar.gz"
      - name: Generate an inventory from observed build outputs
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'numina-runtime-artifacts'
          def sha(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          def subject(name):
              path = output / name
              if not path.is_file() or path.is_symlink() or not 0 < path.stat().st_size <= 1024 ** 3:
                  raise SystemExit('Build output is missing, unsafe or larger than the archive policy')
              return {'name': name, 'bytes': path.stat().st_size, 'sha256': sha(path)}
          inspected = json.loads((output / 'image-inspect.json').read_text())
          if not isinstance(inspected, list) or len(inspected) != 1:
              raise SystemExit('Unexpected built-image inspection')
          image = inspected[0]
          image_id = (output / 'image-id.txt').read_text().strip()
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', image_id) or image.get('Id') != image_id:
              raise SystemExit('Built image identity mismatch')
          if image.get('Os') != 'linux' or image.get('Architecture') != 'amd64':
              raise SystemExit('Built image platform mismatch')
          config = image.get('Config', {})
          if config.get('User') not in ('node:node', '1000:1000'):
              raise SystemExit('Runtime image must default to the reviewed non-root user')
          if config.get('Entrypoint') != ['node', '/opt/numina/runtime-entrypoint.mjs'] or config.get('Cmd') != ['check-runtime', '/var/lib/numina/journal']:
              raise SystemExit('Runtime image must default to local observation only')
          records = json.loads((output / 'source-files.json').read_text())
          by_name = {row['path']: row for row in records}
          inventory = {
              'schema': 'numina.nusd.hosted-runtime-build.v1',
              'status': 'image_built_application_not_started_not_deployed',
              'source': {'repository': os.environ['SOURCE_REPOSITORY'], 'repositoryId': int(os.environ['SOURCE_REPOSITORY_ID']),
                         'ref': os.environ['SOURCE_REF'], 'commit': os.environ['SOURCE_SHA'], 'directory': 'runtime/nusd'},
              'run': {'id': int(os.environ['RUN_ID']), 'attempt': int(os.environ['RUN_ATTEMPT']),
                      'url': 'https://github.com/' + os.environ['SOURCE_REPOSITORY'] + '/actions/runs/' + os.environ['RUN_ID'] + '/attempts/' + os.environ['RUN_ATTEMPT']},
              'baseImageRequested': os.environ['EXPECTED_BASE_IMAGE'],
              'image': {'configDigest': image_id, 'os': image['Os'], 'architecture': image['Architecture'],
                        'localBuildTag': 'numina-nusd-runtime:candidate', 'archiveFormat': 'gzip-compressed docker image save',
                        'registryPushed': False, 'applicationContainerStarted': False},
              'sourceArchive': subject('numina-nusd-linux-runtime-source.tar.gz'),
              'imageArchive': subject('numina-nusd-linux-runtime-image.docker.tar.gz'),
              'files': records,
              'contract': {'artifactSha256': by_name['artifacts/NuminaUSD.json']['sha256'],
                           'sourceSha256': by_name['contracts/NuminaUSD.sol']['sha256'],
                           'role': 'precompiled_input', 'solidityCompiledThisRun': False, 'deploymentPerformed': False},
              'dockerVersion': json.loads((output / 'docker-version.json').read_text()),
              'buildScope': {'dockerBuildExecuted': True, 'dockerfileBuildStepsExecuted': True,
                             'applicationEntrypointExecuted': False, 'testsRun': False, 'rpcCredentialsSupplied': False,
                             'providerSubmissionPerformed': False, 'contractBroadcast': False, 'mintOrTransferPerformed': False},
              'slsaLevelClaimed': None, 'submissionReady': False, 'independentAuditPerformed': False,
              'reservesVerified': False, 'settlementConnected': False,
          }
          (output / 'numina-nusd-runtime-inventory.json').write_text(json.dumps(inventory, sort_keys=True, indent=2) + '\n')
          PY
      - name: Store the exact runtime source archive
        id: upload_source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/numina-runtime-artifacts/numina-nusd-linux-runtime-source.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Store the exact compressed Docker image archive
        id: upload_image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/numina-runtime-artifacts/numina-nusd-linux-runtime-image.docker.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Store the builder-generated runtime inventory
        id: upload_inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/numina-runtime-artifacts/numina-nusd-runtime-inventory.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: numina-provenance
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      source_sha256: ${{ steps.digests.outputs.source_sha256 }}
      image_archive_sha256: ${{ steps.digests.outputs.image_archive_sha256 }}
      inventory_sha256: ${{ steps.digests.outputs.inventory_sha256 }}
      attestation_url: ${{ steps.sign.outputs.attestation-url }}
    steps:
      # Fresh signer job: no checkout, source scripts, extraction, Docker or npm.
      - name: Receive the immutable source archive from this build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.source_artifact_id }}
          path: ${{ runner.temp }}/source
          skip-decompress: true
          digest-mismatch: error
      - name: Receive the immutable image archive from this build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.image_artifact_id }}
          path: ${{ runner.temp }}/image
          skip-decompress: true
          digest-mismatch: error
      - name: Receive the immutable generated inventory from this build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.inventory_artifact_id }}
          path: ${{ runner.temp }}/inventory
          skip-decompress: true
          digest-mismatch: error
      - name: Calculate the three exact subject digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/source/numina-nusd-linux-runtime-source.tar.gz"
          image="$RUNNER_TEMP/image/numina-nusd-linux-runtime-image.docker.tar.gz"
          inventory="$RUNNER_TEMP/inventory/numina-nusd-runtime-inventory.json"
          for artifact in "$source" "$image" "$inventory"; do
            [[ -f "$artifact" && ! -L "$artifact" ]]
          done
          printf 'source_sha256=%s\n' "$(sha256sum -- "$source" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'image_archive_sha256=%s\n' "$(sha256sum -- "$image" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'inventory_sha256=%s\n' "$(sha256sum -- "$inventory" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Attest the source archive, built image archive and generated inventory
        id: sign
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/source/numina-nusd-linux-runtime-source.tar.gz
            ${{ runner.temp }}/image/numina-nusd-linux-runtime-image.docker.tar.gz
            ${{ runner.temp }}/inventory/numina-nusd-runtime-inventory.json
          # Platform-generated SLSA predicate only; no caller-supplied statement.
      - name: Retain the actual detached Sigstore bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numina-nusd-runtime-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.sign.outputs.bundle-path }}
          if-no-files-found: error
          overwrite: false
          retention-days: 30
